[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brightspace-api"
version = "0.2.0"
description = "Python client + optional FastAPI server for Brightspace (D2L), via a persistent Playwright session. Courses, content, grades, assignments, discussions, announcements, deadlines, and both interactive and fully-automated login."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.62",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
]

[project.scripts]
brightspace-login = "brightspace_api.session:cli_bootstrap_interactive"
brightspace-login-scripted = "brightspace_api.session:cli_bootstrap_scripted"
brightspace-serve = "brightspace_api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
